name: Deploy to Cloudflare

# Publishes the app and its API to Cloudflare Pages (https://frame-puzzle.pages.dev) whenever the
# default branch changes; other branches get a preview address. The first run creates the Pages
# project. One-time setup, as repository secrets:
#   CLOUDFLARE_API_TOKEN   permissions: Account > Cloudflare Pages: Edit (and Hyperdrive: Edit, optional)
#   CLOUDFLARE_ACCOUNT_ID
#   DATABASE_URL           postgres://user:password@host/db?sslmode=require, the family's shared data
# Without the Cloudflare secrets this workflow only builds; without DATABASE_URL it deploys the app
# but sharing with the family answers "No database configured".
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER: npx --yes wrangler@4.140.0
  PROJECT: frame-puzzle

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Tests run in CI; the deploy only builds.
      - run: npm ci
      - run: npm run build
      - id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the Cloudflare deploy."
          fi
          if [ -n "$DATABASE_URL" ]; then
            echo "database=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DATABASE_URL is not set; sharing with the family will not work."
          fi
      # Every branch shares the one database, so a preview can be tried before merging. Migrations
      # only ever add to the schema, and each is applied once.
      - name: Apply database migrations
        if: steps.ready.outputs.deploy == 'true' && steps.ready.outputs.database == 'true'
        run: node scripts/migrate.mjs
      - name: Create the Pages project if needed
        if: steps.ready.outputs.deploy == 'true'
        env:
          PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! $WRANGLER pages project list --json | jq -e --arg n "$PROJECT" '.[] | select(."Project Name" == $n)' > /dev/null; then
            $WRANGLER pages project create "$PROJECT" --production-branch "$PRODUCTION_BRANCH"
          fi
      - name: Give the API the database address
        if: steps.ready.outputs.deploy == 'true' && steps.ready.outputs.database == 'true'
        run: |
          for env in production preview; do
            printf '%s' "$DATABASE_URL" | $WRANGLER pages secret put DATABASE_URL --project-name "$PROJECT" --env "$env"
          done
      # Optional: with Hyperdrive: Edit on the token, the API reaches the database through
      # Hyperdrive, which keeps connections open; without it the API connects directly.
      - name: Connect Hyperdrive
        if: steps.ready.outputs.deploy == 'true' && steps.ready.outputs.database == 'true'
        continue-on-error: true
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs"
          find() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r --arg n "$PROJECT" '.result[] | select(.name == $n) | .id'; }
          id=$(find)
          if [ -z "$id" ]; then
            $WRANGLER hyperdrive create "$PROJECT" --connection-string "$DATABASE_URL" > /dev/null
            id=$(find)
          else
            $WRANGLER hyperdrive update "$id" --connection-string "$DATABASE_URL" > /dev/null
          fi
          test -n "$id"
          printf '\n[[hyperdrive]]\nbinding = "HYPERDRIVE"\nid = "%s"\n' "$id" >> wrangler.toml
          echo "Using Hyperdrive $id"
      - name: Deploy
        if: steps.ready.outputs.deploy == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          $WRANGLER pages deploy --project-name "$PROJECT" --branch "$BRANCH" --commit-hash "$GITHUB_SHA" --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9-]+\.'"$PROJECT"'\.pages\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        id: deploy
      # The new deployment answers, and its API reaches the database.
      - name: Check the API
        if: steps.ready.outputs.deploy == 'true' && steps.ready.outputs.database == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -sS "$URL/api/health" || true)
            echo "$body"
            echo "$body" | jq -e '.ok == true and .db == true' > /dev/null && exit 0
            sleep 10
          done
          exit 1
