name: Deploy to Cloudflare

# Publishes the app and its API to Cloudflare Pages (https://frame-puzzle.pages.dev) whenever the
# default branch changes; other branches get a preview address. The first run creates the Pages
# project and the D1 database. One-time setup: add the repository secrets CLOUDFLARE_API_TOKEN
# (permissions: Account > Cloudflare Pages: Edit, Account > D1: Edit) and CLOUDFLARE_ACCOUNT_ID.
# Without them this workflow only builds and skips the deploy.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER: npx --yes wrangler@4.140.0
  PROJECT: frame-puzzle
  DB_NAME: frame-puzzle

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the Cloudflare deploy."
          fi
      - name: Create the D1 database if needed and point wrangler.toml at it
        if: steps.ready.outputs.deploy == 'true'
        run: |
          id=$($WRANGLER d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          if [ -z "$id" ]; then
            $WRANGLER d1 create "$DB_NAME"
            id=$($WRANGLER d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          fi
          test -n "$id"
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Apply database migrations
        if: steps.ready.outputs.deploy == 'true' && github.ref_name == github.event.repository.default_branch && hashFiles('migrations/*.sql') != ''
        run: $WRANGLER d1 migrations apply "$DB_NAME" --remote
      - name: Create the Pages project if needed
        if: steps.ready.outputs.deploy == 'true'
        env:
          PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! $WRANGLER pages project list --json | jq -e --arg n "$PROJECT" '.[] | select(."Project Name" == $n)' > /dev/null; then
            $WRANGLER pages project create "$PROJECT" --production-branch "$PRODUCTION_BRANCH"
          fi
      - name: Deploy
        if: steps.ready.outputs.deploy == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: $WRANGLER pages deploy --project-name "$PROJECT" --branch "$BRANCH" --commit-hash "$GITHUB_SHA"
