name: CI

# Runs once per change: on pull requests, and on pushes to the default branch (a push to a PR's
# branch is covered by its pull_request run). A newer push cancels the run it replaces. One job
# does everything, so the setup (checkout, npm ci) is paid for once: Actions minutes are limited
# while the repository is private.
on:
  pull_request:
  push:
    branches: [claude/ios-frame-puzzle-mvp-pdpzm1]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The API's tests (tests/sync.test.ts) run against a real Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # End-to-end tests build the app themselves, so there is no separate build step.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
