name: Fetch new pictures

# Temporary helper while new built-in pictures are being made: the development machine cannot reach
# figma.com, so a runner downloads the pictures made with Figma AI into src/pictures as JPEG, makes
# their small copies and commits them to the branch they are being made on. Removed once all the
# pictures are in.

on:
  push:
    branches: [claude/project-thread-0md0qb]
    paths: [.github/new-picture-urls.txt]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Download and convert
        run: |
          mkdir -p /tmp/raw
          # Each line: <picture name> https://www.figma.com/api/mcp/asset/<id>.png
          while read -r name url; do
            [ -z "$name" ] && continue
            case "$name" in [a-z0-9]*) ;; *) echo "Bad name: $name"; exit 1 ;; esac
            case "$name" in *[!a-z0-9-]*) echo "Bad name: $name"; exit 1 ;; esac
            case "$url" in https://www.figma.com/api/mcp/asset/*) ;; *) echo "Bad URL for $name"; exit 1 ;; esac
            out="src/pictures/$name.jpg"
            [ -f "$out" ] && continue
            curl -fsSL -o "/tmp/raw/$name.png" "$url"
            python -c 'import sys; from PIL import Image; Image.open(sys.argv[1]).convert("RGB").save(sys.argv[2], quality=90, optimize=True, progressive=True)' "/tmp/raw/$name.png" "$out"
          done < .github/new-picture-urls.txt
          python scripts/thumbs.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pictures
          git diff --cached --quiet || { git commit -m "Add generated pictures"; git push; }
